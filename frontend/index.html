<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabPulse | Report a lab equipment fault</title>
  <style>
    :root { --ink:#14232e; --muted:#5a6b78; --line:#cfd8df; --bg:#eef2f5; --pulse:#0b7a75; --warn:#8a5a00; --warn-bg:#fdf1d8; --ok:#1f6b45; --ok-bg:#e1f3e8; --bad:#9b1c1c; --bad-bg:#fbe4e2; }
    * { box-sizing: border-box; }
    body { margin:0; padding:24px 16px 48px; background:var(--bg); color:var(--ink); font-family: system-ui, "Segoe UI", sans-serif; line-height:1.5; }
    .wrap { max-width:520px; margin:0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
    .brand { display:flex; align-items:center; gap:10px; font-size:1.35rem; font-weight:700; letter-spacing:-.01em; }
    .brand svg { width:44px; height:20px; }
    a.staff { color:var(--muted); font-size:.9rem; text-decoration:none; border-bottom:1px solid var(--line); }
    a.staff:hover, a.staff:focus-visible { color:var(--pulse); border-color:var(--pulse); }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:24px; }
    h1 { margin:0 0 4px; font-size:1.25rem; }
    p.sub { margin:0 0 18px; color:var(--muted); }
    label { display:block; margin:16px 0 4px; font-weight:600; font-size:.9rem; }
    input, textarea { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:6px; font:inherit; color:inherit; background:#fff; }
    input:focus-visible, textarea:focus-visible, button:focus-visible { outline:3px solid #7cc7c2; outline-offset:1px; }
    textarea { min-height:100px; resize:vertical; }
    .err { color:var(--bad); font-size:.82rem; min-height:1.1em; margin-top:2px; }
    #status { display:none; margin:12px 0 0; padding:10px 12px; border-radius:6px; font-size:.9rem; }
    #status.warn { display:block; background:var(--warn-bg); color:var(--warn); }
    #status.clear { display:block; background:var(--ok-bg); color:var(--ok); }
    button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:6px; background:var(--pulse); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    button:hover { background:#096560; }
    button:disabled { background:#8fbfbc; cursor:not-allowed; }
    #result { margin-top:16px; padding:12px; border-radius:6px; display:none; }
    #result.ok { display:block; background:var(--ok-bg); color:var(--ok); }
    #result.fail { display:block; background:var(--bad-bg); color:var(--bad); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg viewBox="0 0 44 20" fill="none" stroke="#0b7a75" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 11h9l4-8 6 15 5-10 3 3h15"/></svg>
        LabPulse
      </div>
      <a class="staff" href="staff.html">Staff login</a>
    </header>

    <div class="card">
      <h1>Report a lab equipment fault</h1>
      <p class="sub">Scan the code on the machine, or type its ID. It takes under a minute.</p>
      <form id="form" novalidate>
        <label for="equipment_id">Equipment ID</label>
        <input id="equipment_id" name="equipment_id" placeholder="e.g. PC-14" maxlength="20" autocomplete="off">
        <div class="err" data-for="equipment_id"></div>
        <div id="status" role="status"></div>

        <label for="lab">Lab</label>
        <input id="lab" name="lab" placeholder="e.g. Networks Lab" maxlength="50">
        <div class="err" data-for="lab"></div>

        <label for="description">What is wrong?</label>
        <textarea id="description" name="description" maxlength="500" placeholder="Describe the problem"></textarea>
        <div class="err" data-for="description"></div>

        <label for="reporter_email">Your email (optional)</label>
        <input id="reporter_email" name="reporter_email" type="email" placeholder="you@example.com">
        <div class="err" data-for="reporter_email"></div>

        <button id="submit" type="submit">Send report</button>
      </form>
      <div id="result" role="status"></div>
    </div>
  </div>

  <script>
    const API = "https://qa8chos6le.execute-api.ap-south-1.amazonaws.com";
    const form = document.getElementById("form");
    const result = document.getElementById("result");
    const submitBtn = document.getElementById("submit");
    const banner = document.getElementById("status");
    const ID_RE = /^[A-Za-z0-9-]{2,20}$/;

    function clearBanner() { banner.className = ""; banner.textContent = ""; }

    // Ask the API whether this machine already has an open report.
    async function checkStatus(id) {
      id = id.trim();
      if (!ID_RE.test(id)) { clearBanner(); return; }
      try {
        const res = await fetch(API + "/status/" + encodeURIComponent(id));
        const b = await res.json();
        if (!res.ok || !b.ok) { clearBanner(); return; }
        if (b.has_open_report) {
          const n = b.report_count;
          banner.className = "warn";
          banner.textContent = b.equipment_id + " already has an open report (" +
            b.status.replace("_", " ").toLowerCase() + ", reported " + n + (n === 1 ? " time" : " times") +
            "). Your report will be added to it.";
        } else {
          banner.className = "clear";
          banner.textContent = "No open report for " + b.equipment_id + ". You are reporting a new fault.";
        }
      } catch (e) { clearBanner(); }
    }

    // QR link such as ?eq=PC-14 fills the ID and checks its status.
    const eq = new URLSearchParams(location.search).get("eq");
    if (eq) {
      document.getElementById("equipment_id").value = eq.slice(0, 20);
      checkStatus(eq);
    }
    document.getElementById("equipment_id").addEventListener("blur", (e) => checkStatus(e.target.value));

    function setErrors(errors) {
      document.querySelectorAll(".err").forEach(el => { el.textContent = errors[el.dataset.for] || ""; });
    }

    function validate(d) {
      const e = {};
      if (!ID_RE.test(d.equipment_id)) e.equipment_id = "Use 2-20 letters, numbers or hyphens.";
      if (d.lab.length < 2 || d.lab.length > 50) e.lab = "Lab name must be 2-50 characters.";
      if (d.description.length < 10 || d.description.length > 500) e.description = "Describe the problem in 10-500 characters.";
      if (d.reporter_email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.reporter_email)) e.reporter_email = "Enter a valid email or leave it blank.";
      return e;
    }

    function show(kind, text) { result.className = kind; result.textContent = text; }

    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      result.className = ""; result.textContent = "";

      const data = {
        equipment_id: form.equipment_id.value.trim(),
        lab: form.lab.value.trim(),
        description: form.description.value.trim(),
        reporter_email: form.reporter_email.value.trim()
      };

      const errors = validate(data);
      setErrors(errors);
      if (Object.keys(errors).length) { show("fail", "Fix the highlighted fields and send again."); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";
      try {
        const res = await fetch(API + "/reports", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        const body = await res.json();
        if (res.ok && body.ok) {
          show("ok", body.merged
            ? "Added to open report " + body.report_id + ". It has now been reported " + body.report_count + " times."
            : "Report sent. Your report ID is " + body.report_id + ".");
          const keep = data.equipment_id;
          form.reset();
          form.equipment_id.value = keep;
          checkStatus(keep);
        } else {
          setErrors(body.errors || {});
          show("fail", body.message || "The server rejected the report.");
        }
      } catch (err) {
        show("fail", "Could not reach the server. Check your connection and send again.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Send report";
      }
    });
  </script>
</body>
</html>
